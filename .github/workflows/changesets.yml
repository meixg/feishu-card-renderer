name: Maintain Changesets release PR

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changesets-release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: Maintain draft release PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the draft Release PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: "chore: release feishu-card-renderer"
          commit: "chore: release feishu-card-renderer"
          commitMode: github-api
          prDraft: always
          setupGitUser: false
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
