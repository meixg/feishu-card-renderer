name: Visual baseline refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh visual baselines (artifact only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install managed Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify visual environment contract
        run: pnpm visual:environment

      - name: Regenerate visual snapshots
        run: pnpm visual:update
        env:
          FCR_VISUAL_REFRESH: "1"

      - name: Upload visual snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-snapshots-${{ github.run_attempt }}
          path: tests/visual/card-renderer.visual.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 7
