name: Publish package

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the accepted release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install fixed npm
        run: npm install --global npm@11.18.0

      - name: Verify release toolchain
        run: |
          node --version
          test "$(npm --version)" = "11.18.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build from the accepted release commit
        run: pnpm build

      - name: Verify the real packed consumer
        run: pnpm package:verify

      - name: Inspect registry and reconcile an existing release
        id: release-state
        run: node scripts/reconcile-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRIGGER_COMMIT: ${{ github.sha }}
          RELEASE_PHASE: before-publish

      - name: Publish an unpublished version with Changesets
        id: publish
        if: steps.release-state.outputs.should-publish == 'true'
        continue-on-error: true
        run: pnpm changeset publish

      - name: Reconcile and verify npm, tag, Release, source and provenance
        run: node scripts/reconcile-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRIGGER_COMMIT: ${{ github.sha }}
          RELEASE_SOURCE_POLICY: ${{ steps.release-state.outputs.source_policy }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
