name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: Regenerate Linux snapshots on the hosted runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package-candidate:
    name: Package candidate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm unit

      - name: Build library
        run: pnpm build

      - name: Verify packed consumer contract
        run: pnpm package:verify

  full-quality:
    name: Full quality (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run component interaction tests
        run: pnpm component

      - name: Run accessibility tests
        run: pnpm accessibility

      - name: Install managed Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run visual regression tests
        if: ${{ !inputs.update_visual_snapshots }}
        run: pnpm visual

      - name: Regenerate visual snapshots
        if: ${{ inputs.update_visual_snapshots }}
        run: pnpm visual:update

      - name: Upload visual failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-failure-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload regenerated visual snapshots
        if: ${{ inputs.update_visual_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-snapshots-${{ github.run_attempt }}
          path: tests/visual/card-renderer.visual.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 7

      - name: Build project site
        run: pnpm site:build
