name: Visual determinism proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: Three strict visual runs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install managed Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify visual environment contract
        run: pnpm visual:environment

      - name: Run strict visual suite three times
        run: pnpm visual:determinism
        env:
          FCR_VISUAL_DETERMINISM_DIR: ${{ runner.temp }}/visual-determinism

      - name: Upload hash evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-determinism-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-determinism
          if-no-files-found: error
          retention-days: 7
