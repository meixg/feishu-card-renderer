name: Visual compositor experiment

on:
  pull_request:
    branches: ["main"]
    types: [synchronize]

permissions:
  contents: read

jobs:
  experiment:
    name: Incremental compositor flags
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked environment
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run incremental single-variable experiments
        run: |
          evidence="$RUNNER_TEMP/compositor-evidence"
          mkdir -p "$evidence"
          cp playwright.config.ts "$RUNNER_TEMP/playwright.config.base.ts"
          git rev-parse HEAD > "$evidence/checkout-sha.txt"
          for mode in baseline disable-threaded-compositing disable-partial-raster disable-zero-copy; do
            cp "$RUNNER_TEMP/playwright.config.base.ts" playwright.config.ts
            case "$mode" in
              baseline) flag="" ;;
              disable-threaded-compositing) flag="--disable-threaded-compositing" ;;
              disable-partial-raster) flag="--disable-partial-raster" ;;
              disable-zero-copy) flag="--disable-zero-copy" ;;
            esac
            if [ -n "$flag" ]; then
              FLAG="$flag" node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const path = "playwright.config.ts";
          const source = readFileSync(path, "utf8").replace(
            'args: ["--disable-skia-runtime-opts"]',
            `args: ["--disable-skia-runtime-opts", ${JSON.stringify(process.env.FLAG)}]`,
          );
          writeFileSync(path, source);
          NODE
            fi
            for repetition in 1 2 3; do
              run_dir="$evidence/$mode/run-$repetition"
              mkdir -p "$run_dir"
              set +e
              FCR_VISUAL_HASH_EVIDENCE_DIR="$run_dir" \
                pnpm exec playwright test --workers=1 \
                --grep 'Button tokens|form controls cover light' \
                > "$run_dir/playwright.log" 2>&1
              status=$?
              set -e
              printf '%s\n' "$status" > "$run_dir/exit-code.txt"
              find "$run_dir" -type f -name '*.png' -print0 \
                | sort -z | xargs -0 -r sha256sum > "$run_dir/sha256.txt"
            done
          done

      - name: Upload compositor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compositor-experiment-${{ github.run_id }}
          path: ${{ runner.temp }}/compositor-evidence
          if-no-files-found: error
          retention-days: 14
